name: Docker Build and Push

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      registry_name:
        description: Container registry host
        required: true
        type: string
      registry_username:
        description: Container registry username
        required: true
        type: string
      image_name:
        description: Docker image name
        required: false
        type: string
        default: ""
      docker_context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile (relative to repo root)
        required: false
        type: string
        default: ""
      build_args:
        description: Build-time arguments, one KEY=VALUE per line
        required: false
        type: string
        default: ""
      push_image:
        description: Whether to push the image to the registry
        required: false
        type: boolean
        default: true
      notify_telegram:
        description: Whether to send a Telegram notification
        required: false
        type: boolean
        default: false
    secrets:
      docker_registry_token:
        required: true
      telegram_chat_id:
        required: false
      telegram_bot_token:
        required: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.telegram_bot_token }}
      TELEGRAM_CHAT_ID: ${{ secrets.telegram_chat_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine tags
        id: meta
        run: |
          IMAGE="${{ inputs.registry_name }}/${{ inputs.registry_username }}/${{ inputs.image_name != '' && inputs.image_name || github.event.repository.name }}"
          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
          TAGS="$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            TAGS="$TAGS
          $IMAGE:latest"
          else
            TAGS="$TAGS
          $IMAGE:$SAFE_REF"
          fi
          {
            echo "image=$IMAGE"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry_name }}
          username: ${{ inputs.registry_username }}
          password: ${{ secrets.docker_registry_token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || format('{0}/Dockerfile', inputs.docker_context) }}
          build-args: ${{ inputs.build_args }}
          push: ${{ inputs.push_image }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          
      - name: Write Docker Summary
        if: always() && !cancelled()
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          PUSH_IMAGE: ${{ inputs.push_image }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 🐳 Docker Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Repository | \`${GITHUB_REPOSITORY}\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Status | $([ "$JOB_STATUS" = "success" ] && echo '✅ Success' || echo '❌ Failed') |"
            echo "| Push enabled | \`${PUSH_IMAGE}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo ""
            echo "### Image tags"
            echo ""

            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`$tag\`"
            done <<< "$IMAGE_TAGS"

            if [ "$PUSH_IMAGE" = "true" ]; then
              FIRST_TAG=$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)
              echo ""
              echo "### Pull command"
              echo ""
              echo '```bash'
              echo "docker pull $FIRST_TAG"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Escape commit message
        id: commit
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "message<<GHEOF"
            python3 -c 'import html, os; m = os.environ.get("MESSAGE", "").splitlines(); print(html.escape((m[0] if m else "")[:300], quote=False))'
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"
          
      - name: Notify Telegram
        if: ${{ always() && inputs.notify_telegram == true && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.telegram_chat_id }}
          token: ${{ secrets.telegram_bot_token }}
          format: html
          message: |
            <b>${{ job.status == 'success' && '✅' || '❌' }} ${{ github.repository }}</b>
            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Commit:</b> <code>${{ github.sha }}</code>
            <b>By:</b> ${{ github.actor }}
            ${{ steps.commit.outputs.message }}
